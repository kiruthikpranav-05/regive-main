<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ReWear{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>
{% if current_user.is_authenticated %}<header class="appbar"><a class="brand" href="{{ url_for('auth.redirect_dashboard') }}">re<span>wear</span></a><nav><a href="{{ url_for('auth.logout') }}">Log out</a></nav></header>{% else %}<header class="nav"><a class="brand" href="{{ url_for('index') }}">re<span>wear</span></a><nav><a href="{{ url_for('index') }}#how">How it works</a><a href="{{ url_for('index') }}#about">About</a><a href="{{ url_for('auth.login') }}">Login</a><a class="button small" href="{{ url_for('auth.register') }}">Get started</a></nav></header>{% endif %}
<main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="toast {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{ url_for('static', filename='js/main.js') }}"></script></body></html>
