{% extends 'base.html' %}{% block content %}<section class="dash"><div class="dash-head"><div><p class="eyebrow">USER MANAGEMENT</p><h1>Community members.</h1></div><a href="{{url_for('admin.dashboard')}}">← Overview</a></div><form class="filters"><input name="search" value="{{search}}" placeholder="Search name or email"><select name="role"><option value="">All roles</option>{% for x in ['DONOR','NGO','ADMIN'] %}<option {%if role==x%}selected{%endif%}>{{x}}</option>{%endfor%}</select><button>Filter</button></form><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Mobile</th><th>Role</th><th>Joined</th></tr></thead><tbody>{%for u in users%}<tr><td>#{{u.id}}</td><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.mobile}}</td><td><span class="badge {{u.role|lower}}">{{u.role}}</span></td><td>{{u.created_at.strftime('%d %b %Y')}}</td></tr>{%else%}<tr><td colspan="6">No users found.</td></tr>{%endfor%}</tbody></table></div></section>{% endblock %}
