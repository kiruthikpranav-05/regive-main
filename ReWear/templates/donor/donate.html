{% extends 'base.html' %}{% block content %}<section class="dash"><div class="dash-head"><div><p class="eyebrow">NEW DONATION</p><h1>Pass it forward.</h1></div><a href="{{ url_for('donor.dashboard') }}">← Dashboard</a></div><form class="form-grid panel" method="post" enctype="multipart/form-data"><label>Donation title<input name="title" required placeholder="e.g. Winter essentials bundle"></label><label>Category<select name="category">{% for x in ['Shirts','T-Shirts','Pants','Dresses','Sarees','Kids Wear','Jackets','Other'] %}<option>{{ x }}</option>{% endfor %}</select></label><label>Description<textarea name="description" required></textarea></label><label>Quantity<input name="quantity" type="number" min="1" required></label><label>Condition<select name="condition"><option>Like New</option><option>Good</option><option>Usable</option></select></label><label>Clothing image<input name="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Pickup address<textarea name="pickup_address" required></textarea></label><label>Mobile number<input name="contact_number" required></label><button class="button">Publish donation</button></form></section>{% endblock %}
