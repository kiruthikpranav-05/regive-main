{% extends 'base.html' %}{% block title %}Join ReWear{% endblock %}{% block content %}<section class="auth"><form method="post"><p class="eyebrow">CREATE AN ACCOUNT</p><h1>Start a ripple of good.</h1><div class="role-picker"><label><input type="radio" name="role" value="DONOR" checked> I’m a donor</label><label><input type="radio" name="role" value="NGO"> I’m an NGO</label></div><label>Name / NGO name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Mobile number<input name="mobile" required></label><label>NGO address <small>(required for NGOs)</small><textarea name="address"></textarea></label><label>Password<input name="password" type="password" minlength="8" required></label><label>Confirm password<input name="confirm_password" type="password" minlength="8" required></label><button class="button">Create account</button><p>Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p></form></section>{% endblock %}
